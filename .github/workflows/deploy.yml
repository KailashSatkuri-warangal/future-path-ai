name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Check
        run: npm run build

      # ✅ Only deploy if build succeeds
      - name: Trigger Vercel Deploy
        if: github.ref == 'refs/heads/main'
        run: curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_prUgUpncF3gqPSwRQeP0iZg7ESHb/BuvAp7ID4s"
